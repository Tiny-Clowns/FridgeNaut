name: flutter_fridge_app
description: "A new Flutter project."

publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^3.0.3
  dio: ^5.9.0
  sqflite: ^2.4.2
  path_provider: ^2.1.5
  connectivity_plus: ^7.0.0
  shared_preferences: ^2.5.3
  intl: ^0.20.2
  path: ^1.9.1
  image_picker: ^1.1.0
  google_mlkit_text_recognition: ^0.14.0
  flutter_launcher_icons: ^0.10.0
  flutter_local_notifications: ^20.0.0
  timezone: ^0.10.1
  flutter_timezone: ^5.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0

# The following section is specific to Flutter packages.
flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/icons/fridge_naut.png

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icons/fridge_naut.png"
